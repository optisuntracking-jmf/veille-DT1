# Configuration de l'automate de veille scientifique DT1
# ---------------------------------------------------------
# Toutes les dates manipulées par le script sont en UTC.
# Le format d'affichage dans le Markdown est contrôlé par `date_format`.

markdown_file: "diabete-type1-veille.md"
dedup_store: "dedup_store.json"
log_file: "logs/veille.log"

# --- Notification par email (optionnelle) ---------------------------------
# Envoyée UNIQUEMENT en exécution réelle (jamais en --dry-run, sauf avec
# --test-email qui force un envoi de test). Le mot de passe n'est jamais
# stocké ici : voir credentials_file.
email:
  enabled: true
  smtp_host: "smtp.gmail.com"
  smtp_port: 587
  from_addr: "fuz2308@gmail.com"
  # Un seul destinataire pendant les tests. Pour repasser à plusieurs
  # destinataires, décommenter le bloc to_addrs ci-dessous et supprimer
  # (ou commenter) la ligne to_addr.
  #to_addr: "jmfusella@free.fr"
  to_addrs:
     - "jmfusella@free.fr"
     - "marionfusella@gmail.com"
  # Fichier séparé (exclu du suivi de version) contenant le mot de passe
  # d'application Gmail. Voir email_credentials.example.yaml pour le format
  # et README.md pour comment le générer.
  credentials_file: "email_credentials.yaml"
  # true : un email seulement s'il y a du nouveau (fiche mise à jour ou
  # nouvelle entrée) ou une erreur. false : un email à chaque exécution.
  only_if_changes: true

# Format d'affichage des dates insérées dans la section 5 (strftime)
# JJ/MM/AAAA choisi par l'utilisateur.
date_format: "%d/%m/%Y"

# Fenêtre glissante de recherche, en jours avant "aujourd'hui" (ou avant
# --window-end si fourni en ligne de commande pour un test sur une
# période fixe).
window_days: 15

# Nombre max d'entrées insérées par exécution (garde-fou anti-flood).
max_entries_per_run: 40

# --- PubMed (NCBI E-utilities) -------------------------------------------
pubmed:
  # Optionnel : clé API NCBI pour un quota plus élevé (3 -> 10 req/s).
  # Laisser vide si vous n'en avez pas.
  api_key: ""
  # Obligatoire par les CGU NCBI : email de contact identifiant l'appelant.
  email: "optisun.tracking@gmail.com"
  max_results_per_query: 40
  # Requêtes élargies le 28/09/2026 (testées sur la fenêtre 13-28/09/2026 :
  # ~26 -> ~45 articles, aucun article de l'ancienne version perdu).
  # La clause "maladie" accepte les variantes (T1D, T1DM, type I, auto-immun,
  # insulinodépendant, juvénile, LADA, MeSH). Le "*" est une troncature
  # PubMed (transplant* = transplant, transplantation, transplanted...).
  # Termes volontairement écartés car trop bruyants à l'essai : "CGM" seul,
  # "continuous glucose monitoring" seul, "insulin delivery" seul (études
  # observationnelles de métriques glycémiques) et "islet autoantibod*"
  # (épidémiologie des auto-anticorps).
  queries:
    - axis: "Biologique"
      query: >-
        ("islet transplantation"[tiab] OR "islet transplant*"[tiab]
        OR "islet allograft*"[tiab] OR "Islets of Langerhans Transplantation"[mh]
        OR "islets of Langerhans"[tiab] OR "pancreatic islet*"[tiab]
        OR "pancreas transplant*"[tiab] OR "stem cell-derived islet*"[tiab]
        OR "stem cell-derived beta*"[tiab] OR "SC-islet*"[tiab]
        OR "beta cell replacement"[tiab] OR "beta-cell replacement"[tiab]
        OR "insulin-producing cell*"[tiab] OR "insulin-secreting cell*"[tiab]
        OR "encapsulated islet*"[tiab] OR "islet encapsulation"[tiab]
        OR "cell encapsulation"[tiab] OR "macroencapsulation"[tiab]
        OR "microencapsulation"[tiab] OR "immunoisolat*"[tiab]
        OR "bioartificial pancreas"[tiab] OR "xenotransplant*"[tiab]
        OR "hypoimmune"[tiab] OR "stem cell therapy"[tiab]
        OR "gene therapy"[tiab] OR "gene editing"[tiab] OR "CRISPR"[tiab]
        OR "beta cell regeneration"[tiab] OR "beta-cell regeneration"[tiab]
        OR "islet organoid*"[tiab])
        AND ("type 1 diabetes"[tiab] OR "type 1 diabetes mellitus"[tiab]
        OR "type I diabetes"[tiab] OR "T1D"[tiab] OR "T1DM"[tiab]
        OR "Diabetes Mellitus, Type 1"[mh] OR "autoimmune diabetes"[tiab]
        OR "insulin-dependent diabetes"[tiab] OR "juvenile diabetes"[tiab]
        OR "latent autoimmune diabetes"[tiab])
    # Remplacement des cellules productrices d'insuline SANS mention explicite
    # de "type 1" dans le résumé. Ajoutée après avoir manqué l'implant
    # "bouclier cristallin" du Technion/MIT (PMID 41604464, Sci Transl Med
    # 2026) dont le résumé ne dit que "diabetic mice" et "β cells".
    # Ces termes (encapsulation/greffe de cellules bêta ou d'îlots) sont
    # quasi exclusifs au DT1, d'où la seule exigence "diabet*".
    - axis: "Biologique"
      query: >-
        ("immunoisolat*"[tiab] OR "encapsulat*"[tiab]
        OR "bioartificial pancreas"[tiab] OR "islet transplant*"[tiab]
        OR "islet allograft*"[tiab] OR "beta cell replacement"[tiab]
        OR "beta-cell replacement"[tiab] OR "stem cell-derived beta*"[tiab]
        OR "stem cell-derived islet*"[tiab] OR "SC-beta"[tiab]
        OR "SC-islet*"[tiab] OR "insulin-producing cell*"[tiab]
        OR "xenotransplant*"[tiab] OR "hypoimmune"[tiab])
        AND ("beta cell*"[tiab] OR "beta-cell*"[tiab] OR "islet*"[tiab]
        OR "Insulin-Secreting Cells"[mh] OR "Islets of Langerhans"[mh]
        OR "insulin-producing"[tiab])
        AND (diabet*[tiab] OR "glycemic control"[tiab] OR normoglyc*[tiab])
    - axis: "Mécanique"
      query: >-
        ("continuous glucose monitor"[tiab]
        OR "continuous glucose monitoring system*"[tiab] OR "CGM system*"[tiab]
        OR "CGM device*"[tiab] OR "CGM sensor*"[tiab]
        OR "flash glucose monitoring"[tiab] OR "implantable glucose sensor*"[tiab]
        OR "calibration-free"[tiab] OR "insulin pump*"[tiab]
        OR "patch pump*"[tiab] OR "Insulin Infusion Systems"[mh]
        OR "automated insulin delivery"[tiab] OR "closed loop"[tiab]
        OR "closed-loop"[tiab] OR "artificial pancreas"[tiab]
        OR "Pancreas, Artificial"[mh] OR "bionic pancreas"[tiab]
        OR "dual-hormone"[tiab] OR "bihormonal"[tiab] OR "smart insulin"[tiab]
        OR "glucose-responsive insulin"[tiab] OR "connected insulin pen*"[tiab]
        OR "smart insulin pen*"[tiab])
        AND ("type 1 diabetes"[tiab] OR "type 1 diabetes mellitus"[tiab]
        OR "type I diabetes"[tiab] OR "T1D"[tiab] OR "T1DM"[tiab]
        OR "Diabetes Mellitus, Type 1"[mh] OR "autoimmune diabetes"[tiab]
        OR "insulin-dependent diabetes"[tiab] OR "juvenile diabetes"[tiab]
        OR "latent autoimmune diabetes"[tiab])
    - axis: "Immunothérapie"
      query: >-
        ("teplizumab"[tiab] OR "Tzield"[tiab] OR "otelixizumab"[tiab]
        OR "anti-CD3"[tiab] OR "regulatory T cell*"[tiab] OR "Treg*"[tiab]
        OR "tolerogenic"[tiab] OR "immune tolerance"[tiab]
        OR "immunotherapy"[tiab] OR "immunomodulat*"[tiab]
        OR "antigen-specific"[tiab] OR "abatacept"[tiab] OR "rituximab"[tiab]
        OR "golimumab"[tiab] OR "baricitinib"[tiab] OR "JAK inhibitor*"[tiab]
        OR "antithymocyte globulin"[tiab] OR "ustekinumab"[tiab]
        OR "verapamil"[tiab] OR "oral insulin"[tiab] OR "GAD-alum"[tiab]
        OR "Diamyd"[tiab] OR "BCG vaccin*"[tiab] OR "CAR-T"[tiab]
        OR "CAR T"[tiab] OR "disease-modifying"[tiab]
        OR "stage 2 type 1 diabetes"[tiab] OR "beta cell preservation"[tiab]
        OR "beta-cell preservation"[tiab] OR "C-peptide preservation"[tiab])
        AND ("type 1 diabetes"[tiab] OR "type 1 diabetes mellitus"[tiab]
        OR "type I diabetes"[tiab] OR "T1D"[tiab] OR "T1DM"[tiab]
        OR "Diabetes Mellitus, Type 1"[mh] OR "autoimmune diabetes"[tiab]
        OR "insulin-dependent diabetes"[tiab] OR "juvenile diabetes"[tiab]
        OR "latent autoimmune diabetes"[tiab])

# --- ClinicalTrials.gov API v2 --------------------------------------------
clinicaltrials:
  base_url: "https://clinicaltrials.gov/api/v2/studies"
  condition: "Type 1 Diabetes"
  max_results: 50
  # Essais nouvellement enregistrés OU mis à jour dans la fenêtre.
  # (Statuts exclus explicitement : aucun, pour ne pas manquer un arrêt d'essai.)

# --- Flux RSS / Atom --------------------------------------------------------
# category : "agence_reglementaire" | "industriel" | "association" | "academique"
# Ces catégories pilotent la règle de confiance (cf. classify_confidence
# dans main.py) : sans DOI/NCT, "agence_reglementaire" et "industriel"
# donnent une confiance Moyenne ; "association" est traitée comme Faible
# ("non confirmé") sauf si l'article cite lui-même un DOI/NCT.
# Flux vérifiés (200 + XML valide constaté le 18/09/2026), voir
# README.md section "Flux RSS - statut de vérification" pour le détail.
rss_feeds:
  - name: "FDA - Communiqués de presse"
    url: "https://www.fda.gov/about-fda/contact-fda/stay-informed/rss-feeds/press-releases/rss.xml"
    country: "États-Unis"
    category: "agence_reglementaire"
    axis_hint: null
    enabled: true

  - name: "EMA - Actualités"
    url: "https://www.ema.europa.eu/en/news.xml"
    country: "Union européenne"
    category: "agence_reglementaire"
    axis_hint: null
    enabled: true

  - name: "ANSM - Actualités"
    url: "https://ansm.sante.fr/rss/actualites"
    country: "France"
    category: "agence_reglementaire"
    axis_hint: null
    enabled: true

  - name: "Breakthrough T1D (ex-JDRF) - Communiqués de presse"
    url: "https://www.breakthrought1d.org/for-the-media/press-releases/feed/"
    country: "États-Unis"
    category: "association"
    axis_hint: null
    enabled: true

  - name: "Vertex Pharmaceuticals - Communiqués"
    url: "https://investors.vrtx.com/rss/news-releases.xml"
    country: "États-Unis"
    category: "industriel"
    axis_hint: "Biologique"
    enabled: true

  - name: "Eli Lilly - Newsroom"
    url: "https://investor.lilly.com/rss/news-releases.xml"
    country: "États-Unis"
    category: "industriel"
    axis_hint: null
    enabled: true

  # Dexcom et Insulet utilisent la même plateforme IR (Q4) que Vertex/Lilly,
  # mais l'URL au même format renvoie un 404 confirmé (testé le 18/09/2026,
  # deux fois : d'abord 429 anti-bot, puis 404 propre une fois le blocage
  # anti-bot passé). Ce n'est donc pas juste un blocage temporaire : le
  # schéma d'URL est probablement différent pour ces deux sociétés.
  # Désactivés pour éviter un échec systématique ; à corriger manuellement
  # en trouvant la vraie URL RSS sur investors.dexcom.com / investors.insulet.com.
  - name: "Dexcom - Newsroom (URL à corriger, 404 constaté)"
    url: "https://investors.dexcom.com/rss/news-releases.xml"
    country: "États-Unis"
    category: "industriel"
    axis_hint: "Mécanique"
    enabled: false

  - name: "Insulet - Newsroom (URL à corriger, 404 constaté)"
    url: "https://investors.insulet.com/rss/news-releases.xml"
    country: "États-Unis"
    category: "industriel"
    axis_hint: "Mécanique"
    enabled: false

  # Pas de flux RSS public trouvé (vérifié le 18/09/2026) : Medtronic Diabetes
  # a été absorbé par le site "news.minimed.com" sans balise <link rel=alternate>
  # ni endpoint /rss, et la Fédération Française des Diabétiques n'expose ni
  # /feed ni <link rel="alternate" type="application/rss+xml">. Les activer
  # nécessiterait un scraping HTML généraliste, explicitement exclu comme
  # source principale par le cahier des charges. Laissés désactivés ; on peut
  # les rouvrir manuellement si ces sites publient un flux à l'avenir.
  - name: "Medtronic Diabetes - Newsroom (pas de RSS public)"
    url: "https://news.minimed.com/"
    country: "États-Unis"
    category: "industriel"
    axis_hint: "Mécanique"
    enabled: false

  - name: "Fédération Française des Diabétiques - Actualités (pas de RSS public)"
    url: "https://www.federationdesdiabetiques.org/federation/actualites"
    country: "France"
    category: "association"
    axis_hint: null
    enabled: false

