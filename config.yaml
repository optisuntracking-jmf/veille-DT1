  - "dexcom.com"
  - "insulet.com"
  - "breakthrought1d.org"
  - "federationdesdiabetiques.org"
  - "aphp.fr"

# --- Logique à deux niveaux : mise à jour de fiche vs. nouvelle entrée ----
# Quand une nouveauté correspond à une fiche existante (sections 2-4), son
# résumé traduit est réparti phrase par phrase entre "Bénéfices" et
# "Inconvénients & risques" par simple présence d'un de ces mots-clés
# (tri déterministe par mot-clé, jamais une classification sémantique).
# Une phrase sans mot-clé de risque va par défaut dans "Bénéfices".
risk_keywords:
  - "risque"
  - "risques"
  - "effet indésirable"
  - "effets indésirables"
  - "événement indésirable"
  - "événements indésirables"
  - "grave"
  - "sécurité"
  - "hypoglycémie"
  - "hyperglycémie"
  - "immunosuppression"
  - "rejet"
  - "infection"
  - "neutropénie"
  - "lymphopénie"
  - "décès"
  - "arrêt"
  - "abandon"
  - "toxicité"
  - "toxique"
  - "effet secondaire"
  - "syndrome de libération de cytokines"
  - "complication"
